[project]
name = "procurement-intelligence-lab"
version = "0.1.0"
description = "Trustworthy, provenance-preserving BOM and procurement intelligence architecture lab"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[dependency-groups]
dev = [
  "hypothesis>=6.138",
  "pytest>=8.3",
  "pytest-cov>=6.2",
  "ruff>=0.8",
  "pyright>=1.1",
]
release = ["python-semantic-release>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_intelligence_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/procurement_intelligence_lab/adapters/xlsx.py" = ["I001"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "contract: port and adapter conformance tests",
  "integration: cross-layer public-interface tests",
  "regression: permanent oracles for previously shipped defects",
]

[tool.coverage.run]
branch = true
source = ["procurement_intelligence_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "uv build"
commit_message = "chore(release): {version}"
commit_parser = "conventional"
