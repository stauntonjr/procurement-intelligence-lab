[project]
name = "procurement-intelligence-lab"
version = "0.1.0"
description = "Trustworthy, provenance-preserving BOM and procurement intelligence architecture lab"
requires-python = ">=3.12,<3.14"
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pyright>=1.1"]
release = ["python-semantic-release>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procurement_intelligence_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "uv build"
commit_message = "chore(release): {version}"
commit_parser = "conventional"
