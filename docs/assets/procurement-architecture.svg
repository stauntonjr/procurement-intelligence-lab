<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
<title id="title">Procurement Intelligence Lab: full evidence-to-action architecture</title>
<desc id="desc">Read each numbered column from top to bottom, then move to the next column. Source artifact, structured document, schema-mapped structured document, normalized observations, source assertions, entity mentions, entity resolution decisions, canonical assertions, reconciliation, operational state, derived facts, anomalies, predictions and forecasts, policy decisions, and authorized actions. Selected synthetic procurement paths execute through anomaly assessment. Structure and mapping have separate contracts but are combined physically in the XLSX adapter. Predictions, procurement decision policy, and external action executors remain future work. Gold data at every boundary is the evaluation target, with selected tests and oracles implemented today. Human review is cross-cutting: current assessment review and prospective exact-scope reconciliation preserve history, while broader decision and action approvals remain future work. Every result retains scope, time, evidence, and provenance back to its original source.</desc>
