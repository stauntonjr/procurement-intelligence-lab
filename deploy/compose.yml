name: procurement-inspector

services:
  inspector:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: procurement-inspector
    image: procurement-inspector:${PROCUREMENT_INSPECTOR_REVISION:?set the immutable Git revision}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/healthz', timeout=2).read() == b'{\"status\": \"ok\"}'"
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    labels:
      traefik.enable: "true"
      traefik.docker.network: vps-srv_traefik_public
      traefik.http.routers.procurement.rule: "Host(`procurement.ediacarian.dedyn.io`)"
      traefik.http.routers.procurement.entrypoints: websecure
      traefik.http.routers.procurement.tls.certresolver: desecresolver
      traefik.http.services.procurement.loadbalancer.server.port: "8000"
    networks:
      - traefik_public

networks:
  traefik_public:
    external: true
    name: vps-srv_traefik_public
