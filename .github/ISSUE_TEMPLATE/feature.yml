name: Executable specification
description: Propose a bounded, evidence-backed change
title: "[M0] "
labels:
  - "area:architecture"
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome is required?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
  - type: textarea
    id: interface
    attributes:
      label: Interface
      description: Inputs, outputs, and boundaries
    validations:
      required: true
  - type: textarea
    id: semantic_contract
    attributes:
      label: Semantic Contract
      description: Authoritative inputs/output, scope and as-of rule, governing policy, evidence, and typed failures
    validations:
      required: true
  - type: textarea
    id: scenarios
    attributes:
      label: Scenario Matrix
      description: Applicable empty, many, duplicate, conflict, missing, time, scope, value-boundary, malformed, and public-caller cases
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Non-goals and Architectural Constraints
  - type: textarea
    id: evidence
    attributes:
      label: Evidence Required
