name: Release groundwork
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: echo 'Release automation is intentionally manual until protected-branch policy is configured.'
