name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  static-and-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true }
      - run: uv sync --all-groups --extra workflow
      - run: make check-fast

  unit:
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true, python-version: "${{ matrix.python-version }}" }
      - run: uv sync --all-groups --extra workflow
      - run: make unit

  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: pil_archive
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pil_archive"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PIL_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/pil_archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true }
      - run: uv sync --all-groups --extra workflow
      - run: uv run --extra workflow pytest --cov=procurement_intelligence_lab --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - run: uv run --extra workflow python tools/check_coverage_ratchet.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-coverage
          path: coverage.xml

  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: pil_archive
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pil_archive"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PIL_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/pil_archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true }
      - run: uv sync --all-groups --extra workflow
      - run: make contract

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: pil_archive
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pil_archive"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PIL_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/pil_archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true }
      - run: uv sync --all-groups --extra workflow
      - run: make integration

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true }
      - run: uv sync --all-groups --extra workflow
      - run: make regression

  package-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: pil_archive
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d pil_archive"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PIL_TEST_POSTGRES_DSN: postgresql://postgres@127.0.0.1:5432/pil_archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true }
      - run: uv sync --all-groups --extra workflow
      - run: make package-smoke

  eval-manifest-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with: { enable-cache: true }
      - run: uv sync --all-groups --extra workflow
      - run: make challenge-validate
      - run: uv run --extra workflow python tools/run_challenges.py --verify-known-bad --results artifacts/challenges/latest.json --model "not-evaluated" --configuration "public-oracles-with-known-bad-mutations"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: development-agent-challenge-results
          path: artifacts/challenges/latest.json
